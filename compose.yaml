services:
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://studymingle:studymingle@db:5432/studymingle
      FRONTEND_ORIGINS: http://localhost:5173,https://study.thoughtmingle.com
      STORAGE_ENDPOINT_URL: http://storage:9000
      STORAGE_PUBLIC_ENDPOINT_URL: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: studymingle
      STORAGE_SECRET_ACCESS_KEY: studymingle-local-secret
      STORAGE_BUCKET: studymingle-worksheets
      STORAGE_AUTO_CREATE_BUCKET: "true"
      TUTOR_PROVIDER: ollama
      TUTOR_MODEL: qwen3:4b
      TUTOR_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.11.4
    ports:
      - "11434:11434"
    volumes:
      - studymingle_ollama:/root/.ollama
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studymingle
      POSTGRES_USER: studymingle
      POSTGRES_PASSWORD: studymingle
    ports:
      - "5432:5432"
    volumes:
      - studymingle_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymingle -d studymingle"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: studymingle
      MINIO_ROOT_PASSWORD: studymingle-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - studymingle_storage:/data
    restart: unless-stopped

volumes:
  studymingle_postgres:
  studymingle_storage:
  studymingle_ollama:
